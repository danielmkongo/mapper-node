; PlatformIO Project Configuration File
;
; Safe/Mapper wearable node (UWB tag + IMU + barometer, reports over LoRa E32).
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
; Same pinned core as the anchors (see safe_anchor/platformio.ini for why).
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
; DW1000 is vendored in lib/DW1000 (same patched copy as mapper-anchor). The registry
; release calls SPI.usingInterrupt() (does not build on ESP32) and does SPI inside its
; ISR (freezes the board under load). Keep both repos' copies in sync.

lib_deps =
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit MPU6050@^2.2.6
	xreef/EByte LoRa E32 library@^1.5.13

; This node's id - the "I" field every consumer keys on (app, digital twin, Unity).
build_flags = -D NODE_ID=5
